; ATtiny85 office annoyance. Plain avr-gcc + avr-libc, no framework.
; Flashed through an Arduino Micro running the ArduinoISP sketch.
; Fuses are never written. main() forces 8 MHz through CLKPR, so the
; firmware runs the same on a factory chip (CKDIV8 on, boots at 1 MHz) and on
; one with CKDIV8 already off (the owner's chip: L:E2).

[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 8000000L
build_flags = -Wall -Wextra

; Arduino as ISP, per the PlatformIO atmelavr docs ("Upload using Programmer"),
; but with "-c arduino" instead of "-c stk500v1": the Micro (ATmega32U4) only
; sends serial data once the PC asserts DTR, and on Windows avrdude's stk500v1
; leaves DTR off. Same choice as the Arduino IDE's "Arduino as ISP (ATmega32U4)".
upload_protocol = custom
upload_port = COM3            ; <-- the Micro's COM port (or pass --upload-port)
upload_speed = 19200
upload_flags =
    -C
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED
    -c
    arduino
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i
