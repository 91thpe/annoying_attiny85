; ATtiny85 office annoyance. Plain avr-gcc + avr-libc, no framework.
; Flashed through an Arduino Mega running the ArduinoISP sketch.
; Fuses are never written: the chip boots at 1 MHz (factory CKDIV8) and
; main() switches to 8 MHz through CLKPR.

[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 8000000L
build_flags = -Wall -Wextra

; Arduino as ISP, per the PlatformIO atmelavr docs ("Upload using Programmer")
upload_protocol = custom
upload_port = COM3            ; <-- the Mega's COM port
upload_speed = 19200
upload_flags =
    -C
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED
    -c
    stk500v1
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i
