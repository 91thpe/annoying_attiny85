; Minimal ESP32 variant: M5Stamp S3 beeps once at a random 5-25 min interval.
; Separate PlatformIO project: open or run it from this folder.
; Upload goes over the Stamp's own USB-C port.

[env:stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
; Serial output over the native USB port
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
