; Turns the Arduino Micro into the ISP programmer for the ATtiny85.
; This is a separate PlatformIO project: open or run it from this folder.
;
; src/ArduinoISP.ino is the unmodified example from
; https://github.com/arduino/arduino-examples (11.ArduinoISP), BSD license.
; Target reset on D10; SPI on the Micro's MO / MI / SCK pins.

[env:micro]
platform = atmelavr
board = micro
framework = arduino
